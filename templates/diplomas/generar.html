{% extends "base.html" %}
{% block content %}
<!-- Encabezado y Botones -->
<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h2 class="card-title mb-4">🎓 Generación de Diplomas</h2>
        
        <div class="row g-3">
            <div class="col-md-4">
                <a href="{{ url_for('diplomas.generar_masivo') }}" class="btn btn-info w-100 text-white">
                    <i class="bi bi-file-earmark-excel"></i> Carga Masiva (Excel)
                </a>
            </div>
            <div class="col-md-4">
                <a href="{{ url_for('diplomas.anulados') }}" class="btn btn-warning w-100">
                    <i class="bi bi-exclamation-triangle"></i> Ver Anulados
                </a>
            </div>
            <div class="col-md-4">
                <a href="{{ url_for('diplomas.activos') }}" class="btn btn-secondary w-100">
                    <i class="bi bi-table"></i> Ver Todos
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Formulario de Generación Individual -->
<div class="card shadow">
    <div class="card-body">
        <h4 class="card-title mb-4">📝 Generar Diploma Individual</h4>
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Programa Académico</label>
                    <select name="programa_id" class="form-select form-select-lg" required>
                        <option value="">-- Seleccionar --</option>
                        {% for prog in programas %}
                        <option value="{{ prog.id }}">
                            {{ prog.nombre }} ({{ prog.abreviatura }}) - {{ prog.creditos }} / {{ prog.duracion }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Nombre del Alumno</label>
                    <input type="text" name="nombre_alumno" class="form-control form-control-lg" required 
                           placeholder="Nombre completo del alumno" autofocus>
                </div>
            </div>
            
            <div class="alert alert-info mt-3">
                <i class="bi bi-info-circle"></i> <strong>Nota:</strong> La fecha de emisión se registrará automáticamente (hoy). 
                Los créditos y duración se toman del programa seleccionado.
            </div>
            
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-circle"></i> Generar Diploma
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
